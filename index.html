<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunucusuz Ürün Paylaşımı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 10px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        ul { padding-left: 20px; }
        #qrcode { display: flex; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Ürün Yönetimi (Sunucusuz)</h2>
    
    <input type="text" id="urunGiris" placeholder="Ürün adı yazın...">
    <button onclick="urunEkle()">Ürünü Cihaza Ekle</button>

    <h3>Bu Cihazdaki Ürünler:</h3>
    <ul id="urunListesi"></ul>

    <hr>

    <button style="background-color: #28a745;" onclick="paylasimKoduUret()">Diğer Cihazla Paylaş (QR Kod Üret)</button>
    <div id="qrcode"></div>

    <script>
        // Sayfa açıldığında çalışacak fonksiyonlar
        window.onload = function() {
            urunuUrldenAl();  // B telefonu: URL'de veri varsa hafızaya kaydet
            urunleriListele(); // A ve B telefonu: Hafızadaki ürünleri listele
        };

        // 1. Ürünü LocalStorage'a (Yerel Hafıza) Kaydetme
        function urunEkle() {
            const urunAdi = document.getElementById("urunGiris").value.trim();
            if (!urunAdi) return alert("Lütfen bir ürün adı girin!");

            let urunler = JSON.parse(localStorage.getItem("local_urunler")) || [];
            urunler.push(urunAdi);
            
            localStorage.setItem("local_urunler", JSON.stringify(urunler));
            document.getElementById("urunGiris").value = ""; // Kutuyu temizle
            urunleriListele();
        }

        // 2. Hafızadaki Ürünleri Ekranda Listeleme
        function urunleriListele() {
            const liste = document.getElementById("urunListesi");
            liste.innerHTML = "";
            let urunler = JSON.parse(localStorage.getItem("local_urunler")) || [];
            
            if(urunler.length === 0) {
                liste.innerHTML = "<li>Henüz ürün eklenmemiş.</li>";
                return;
            }

            urunler.forEach(urun => {
                let li = document.createElement("li");
                li.textContent = urun;
                liste.appendChild(li);
            });
        }

        // 3. A TELEFONU: Ürünleri Şifreli URL yapıp QR Koda Dönüştürme
        function paylasimKoduUret() {
            const qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = ""; // Eski QR kodu temizle

            let urunler = localStorage.getItem("local_urunler");
            if (!urunler || urunler === "[]") return alert("Paylaşacak ürününüz yok!");

            // Veriyi güvenli transfer için Base64 formatına çeviriyoruz
            const urlVerisi = btoa(encodeURIComponent(urunler));
            // Mevcut sayfa linkinin sonuna "?veri=..." ekliyoruz
            const paylasimUrli = window.location.origin + window.location.pathname + "?veri=" + urlVerisi;

            // QR Kodu ekranda oluştur
            new QRCode(qrcodeDiv, {
                text: paylasimUrli,
                width: 200,
                height: 200
            });
        }

        // 4. B TELEFONU: QR Kod Okunduğunda URL'deki Veriyi Hafızaya Alma
        function urunuUrldenAl() {
            const urlParams = new URLSearchParams(window.location.search);
            const veriParam = urlParams.get('veri');

            if (veriParam) {
                try {
                    // URL'deki şifreli veriyi çözüyoruz
                    const cozulenVeri = decodeURIComponent(atob(veriParam));
                    const gelenUrunler = JSON.parse(cozulenVeri);

                    // B telefonunun eski ürünleri varsa onlarla birleştir (aynı ürünleri tekrar eklemez)
                    let mevcutUrunler = JSON.parse(localStorage.getItem("local_urunler")) || [];
                    let birlesikListe = [...new Set([...mevcutUrunler, ...gelenUrunler])];

                    localStorage.setItem("local_urunler", JSON.stringify(birlesikListe));
                    
                    // URL'deki "?veri=..." kısmını temizle (sayfa temiz kalsın diye)
                    window.history.replaceState({}, document.title, window.location.pathname);
                    alert("Ürünler başarıyla bu cihaza aktarıldı!");
                } catch (e) {
                    console.error("Veri okunurken hata oluştu:", e);
                }
            }
        }
    </script>
</body>
</html>
