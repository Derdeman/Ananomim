<script>
// =========================================================================
// 1. GLOBAL VERİ MODELİ & INITIALIZATION (BAŞLANGIÇ VERİLERİ)
// =========================================================================
const defaultState = {
    products: [
        { id: 1, name: "El Açması Böreklik Yufka", group: "Yufka", price: 45, stock: 250, img: "" },
        { id: 2, name: "Geleneksel Tel Kadayıf", group: "Kadayıf", price: 60, stock: 180, img: "" },
        { id: 3, name: "Ev Usulü Üçgen Yufka", group: "Yufka", price: 35, stock: 400, img: "" }
    ],
    corporates: [
        { id: 101, title: "Meram Gıda Limited", contact: "Ahmet Yılmaz", user: "meramgida", pass: "1234" },
        { id: 102, title: "Anadolu Süpermarket", contact: "Mehmet Kaya", user: "anadolu", pass: "4321" }
    ],
    logistics: [
        { id: 201, name: "Mustafa Demir", role: "Şehir İçi Dağıtım", user: "mustafa", pass: "1111" },
        { id: 202, name: "Can Arslan", role: "Çevre İlçeler Lojistik", user: "can", pass: "2222" }
    ],
    admins: [
        { id: 1, name: "Fatih Sultan (Merkez)", role: "Süper Admin", user: "admin", pass: "admin42" }
    ],
    orders: [
        { id: 5001, corpId: 101, corpTitle: "Meram Gıda Limited", productId: 1, productName: "El Açması Böreklik Yufka", quantity: 50, total: 2475, driverId: 201, driverName: "Mustafa Demir", status: "Hazırlanıyor" }
    ]
};

// LocalStorage Kontrolü ve Yükleme
function getSystemData() {
    let data = localStorage.getItem("meram_automation_db");
    if (!data) {
        localStorage.setItem("meram_automation_db", JSON.stringify(defaultState));
        return defaultState;
    }
    return JSON.parse(data);
}

function saveSystemData(data) {
    localStorage.setItem("meram_automation_db", JSON.stringify(data));
}

// Global Oturum Değişkeni
let sessionUser = null;

// DOM Yüklendiğinde Başlatılacak Fonksiyonlar
document.addEventListener("DOMContentLoaded", () => {
    getSystemData(); // Veri tabanını initialize et
    renderClientProducts(); // Vitrini doldur
});

// =========================================================================
// 2. UNIFIED LOGIN ENGINE (BİRLEŞİK GİRİŞ SİSTEMİ)
// =========================================================================
function unifiedLoginEngine() {
    const loginType = document.getElementById("loginType").value;
    const userInp = document.getElementById("username").value.trim();
    const passInp = document.getElementById("password").value.trim();
    const errorAlert = document.getElementById("loginError");
    
    const db = getSystemData();
    let foundUser = null;

    if (loginType === "admin") {
        foundUser = db.admins.find(u => u.user === userInp && u.pass === passInp);
    } else if (loginType === "corporate") {
        foundUser = db.corporates.find(u => u.user === userInp && u.pass === passInp);
    } else if (loginType === "service") {
        foundUser = db.logistics.find(u => u.user === userInp && u.pass === passInp);
    }

    if (foundUser) {
        errorAlert.classList.add("d-none");
        sessionUser = { ...foundUser, type: loginType };
        
        // Modalı Kapat
        const loginModal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
        if (loginModal) loginModal.hide();
        
        // Giriş Formunu Temizle
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";

        // İlgili Panele Yönlendir
        document.getElementById("client-interface").style.display = "none";
        
        if (loginType === "admin") {
            document.getElementById("admin-panel").style.display = "block";
            document.getElementById("logged-admin-name").innerText = sessionUser.name;
            switchAdminTab('tab-stock');
        } else if (loginType === "corporate") {
            document.getElementById("corporate-panel").style.display = "block";
            document.getElementById("logged-corp-name").innerText = sessionUser.title;
            switchCorpTab('tab-corp-orders');
        } else if (loginType === "service") {
            // Servisçi arayüz yapısı için tetikleyici
            document.getElementById("service-panel").style.display = "block";
            document.getElementById("logged-service-name").innerText = sessionUser.name;
            renderServiceOrders();
        }
    } else {
        errorAlert.classList.remove("d-none");
    }
}

function logoutSystem() {
    sessionUser = null;
    document.getElementById("admin-panel").style.display = "none";
    document.getElementById("corporate-panel").style.display = "none";
    if(document.getElementById("service-panel")) document.getElementById("service-panel").style.display = "none";
    document.getElementById("client-interface").style.display = "block";
    renderClientProducts();
}

// =========================================================================
// 3. TAB (SEKME) GEÇİŞLERİ VE RENDER İŞLEMLERİ
// =========================================================================
function switchAdminTab(tabId) {
    document.querySelectorAll('#admin-panel .panel-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('#admin-panel .nav-link').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    
    // Link aktifliği tetikleme
    const map = {
        'tab-stock': 'link-stock', 'tab-corporate': 'link-corporate',
        'tab-logistics': 'link-logistics', 'tab-sysadmin': 'link-sysadmin', 'tab-orders': 'link-orders'
    };
    if (map[tabId]) document.getElementById(map[tabId]).classList.add('active');

    // Verileri tablolara bas
    if (tabId === 'tab-stock') renderAdminStockTable();
    if (tabId === 'tab-corporate') renderAdminCorporateTable();
    if (tabId === 'tab-logistics') renderAdminLogisticsTable();
    if (tabId === 'tab-sysadmin') renderAdminSysTable();
    if (tabId === 'tab-orders') renderAdminOrdersTable();
}

function switchCorpTab(tabId) {
    document.querySelectorAll('#corporate-panel .panel-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('#corporate-panel .nav-link').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    
    if(tabId === 'tab-corp-orders') {
        document.getElementById('link-corp-orders').classList.add('active');
        renderCorpOrdersTable();
    }
    if(tabId === 'tab-corp-new') {
        document.getElementById('link-corp-new').classList.add('active');
        prepareCorpOrderForm();
    }
}

// =========================================================================
// 4. TABLO VE VİTRİN RENDER FONKSİYONLARI
// =========================================================================

// Müşteri Vitrini (Ana Sayfa)
function renderClientProducts() {
    const db = getSystemData();
    const searchVal = document.getElementById("clientSearchInput").value.toLowerCase();
    const grid = document.getElementById("client-products-grid");
    grid.innerHTML = "";

    const filtered = db.products.filter(p => p.name.toLowerCase().includes(searchVal) || p.group.toLowerCase().includes(searchVal));

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center text-muted my-4"><small>Aradığınız kriterlere uygun ürün bulunamadı.</small></div>`;
        return;
    }

    filtered.forEach(p => {
        const dummyImg = `<i class="fa-solid fa-wheat-awn fs-1"></i>`;
        const card = `
            <div class="col-6 col-md-4 col-lg-3">
                <div class="product-card p-2">
                    <div class="img-wrapper">${p.img ? `<img src="${p.img}" alt="${p.name}">` : dummyImg}</div>
                    <div class="p-2">
                        <span class="badge bg-secondary mb-1" style="font-size:10px;">${p.group}</span>
                        <h6 class="fw-bold mb-1 text-truncate" style="font-size:14px;" title="${p.name}">${p.name}</h6>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="fw-bold text-success" style="font-size:14px;">${p.price.toFixed(2)} ₺</span>
                            <span class="text-muted" style="font-size:11px;">Stok: <b>${p.stock}</b></span>
                        </div>
                    </div>
                </div>
            </div>
        `;
        grid.insertAdjacentHTML("beforeend", card);
    });
}

// Admin: Ürün & Stok Tablosu
function renderAdminStockTable() {
    const db = getSystemData();
    const tbody = document.getElementById("admin-stock-table-body");
    tbody.innerHTML = "";

    db.products.forEach(p => {
        const tr = `
            <tr>
                <td><i class="fa-solid fa-cookie text-muted"></i></td>
                <td class="fw-bold">${p.name}</td>
                <td><span class="badge bg-light text-dark border">${p.group}</span></td>
                <td>${p.price.toFixed(2)} ₺</td>
                <td><span class="badge ${p.stock < 50 ? 'bg-danger':'bg-success'}">${p.stock} Adet</span></td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash small"></i></button>
                </td>
            </tr>
        `;
        tbody.insertAdjacentHTML("beforeend", tr);
    });
}

// Admin: Bayi Listesi Tablosu
function renderAdminCorporateTable() {
    const db = getSystemData();
    const tbody = document.getElementById("corporate-table-body");
    tbody.innerHTML = "";
    db.corporates.forEach(c => {
        tbody.insertAdjacentHTML("beforeend", `
            <tr>
                <td class="fw-bold">${c.title}</td>
                <td>${c.contact}</td>
                <td><code>${c.user}</code></td>
                <td>••••</td>
                <td class="text-end"><button class="btn btn-sm btn-link text-danger p-0" onclick="deleteCorporate(${c.id})"><i class="fa-solid fa-user-minus"></i></button></td>
            </tr>
        `);
    });
}

// Admin: Dağıtım Ekibi Tablosu
function renderAdminLogisticsTable() {
    const db = getSystemData();
    const tbody = document.getElementById("logistics-table-body");
    tbody.innerHTML = "";
    db.logistics.forEach(l => {
        tbody.insertAdjacentHTML("beforeend", `
            <tr>
                <td class="fw-bold">${l.name}</td>
                <td><small class="text-muted">${l.role}</small></td>
                <td><code>${l.user}</code></td>
                <td>••••</td>
                <td class="text-end"><button class="btn btn-sm btn-link text-danger p-0" onclick="deleteLogistics(${l.id})"><i class="fa-solid fa-trash"></i></button></td>
            </tr>
        `);
    });
}

// Admin: Sistem Yöneticileri Tablosu
function renderAdminSysTable() {
    const db = getSystemData();
    const tbody = document.getElementById("sysadmin-table-body");
    tbody.innerHTML = "";
    db.admins.forEach(a => {
        tbody.insertAdjacentHTML("beforeend", `
            <tr>
                <td class="fw-bold">${a.name}</td>
                <td><span class="badge bg-danger">${a.role}</span></td>
                <td><code>${a.user}</code></td>
                <td>••••</td>
                <td class="text-end"><button class="btn btn-sm btn-link text-danger p-0" onclick="deleteAdmin(${a.id})" ${db.admins.length === 1 ? 'disabled':''}><i class="fa-solid fa-lock-open"></i></button></td>
            </tr>
        `);
    });
}

// Admin: Sipariş Havuzu Yönetimi
function renderAdminOrdersTable() {
    const db = getSystemData();
    const tbody = document.getElementById("orders-table-body");
    tbody.innerHTML = "";

    db.orders.forEach(o => {
        let driverSelectHTML = `<select class="form-select form-select-sm d-inline-block w-auto me-1" onchange="assignDriverToOrder(${o.id}, this.value)"><option value="">Seçilmedi</option>`;
        db.logistics.forEach(l => {
            driverSelectHTML += `<option value="${l.id}" ${o.driverId == l.id ? 'selected':''}>${l.name}</option>`;
        });
        driverSelectHTML += `</select>`;

        let statusBadge = "bg-secondary";
        if(o.status === "Yolda") statusBadge = "bg-warning text-dark";
        if(o.status === "Teslim Edildi") statusBadge = "bg-success";

        const tr = `
            <tr>
                <td class="fw-bold text-primary">${o.corpTitle}</td>
                <td>${o.productName}</td>
                <td><b>${o.quantity}</b> Adet</td>
                <td class="text-success fw-bold">${o.total.toFixed(2)} ₺</td>
                <td>${driverSelectHTML}</td>
                <td><span class="badge ${statusBadge}">${o.status}</span></td>
                <td class="text-end">
                    <button class="btn btn-xs btn-success py-0 px-1" onclick="updateOrderStatus(${o.id}, 'Teslim Edildi')" title="Teslim Edildi"><i class="fa-solid fa-check small"></i></button>
                    <button class="btn btn-xs btn-warning py-0 px-1" onclick="updateOrderStatus(${o.id}, 'Yolda')" title="Yolda"><i class="fa-solid fa-truck small"></i></button>
                </td>
            </tr>
        `;
        tbody.insertAdjacentHTML("beforeend", tr);
    });
}

// =========================================================================
// 5. BAYİ PANELİ SİPARİŞ İŞLEMLERİ (YENİ SİPARİŞ & HESAPLAMA)
// =========================================================================
function prepareCorpOrderForm() {
    const db = getSystemData();
    const select = document.getElementById("corpSelfProductSelect");
    select.innerHTML = `<option value="" disabled selected>Ürün seçiniz...</option>`;
    
    db.products.forEach(p => {
        select.insertAdjacentHTML("beforeend", `<option value="${p.id}">${p.name} (${p.price} ₺ / Stok: ${p.stock})</option>`);
    });

    document.getElementById("corpSelfQuantity").value = "";
    calculateOrderTotalPreview();
}

function calculateOrderTotalPreview() {
    const db = getSystemData();
    const productId = document.getElementById("corpSelfProductSelect").value;
    const qty = parseInt(document.getElementById("corpSelfQuantity").value) || 0;
    
    let subtotal = 0;
    if(productId) {
        const prod = db.products.find(p => p.id == productId);
        if(prod) subtotal = prod.price * qty;
    }
    
    // KDV (%10) Hesaplama simulasyonu
    const tax = subtotal * 0.10;
    const grandTotal = subtotal + tax;

    document.getElementById("basketSubtotal").innerText = subtotal.toFixed(2) + " ₺";
    document.getElementById("basketTax").innerText = tax.toFixed(2) + " ₺";
    
    // Formun içine gizli toplam veya anlık bilgilendirme basılabilir, arayüzde total alanı varsa güncellenir.
}

function createNewOrder(event) {
    event.preventDefault();
    if(!sessionUser || sessionUser.type !== "corporate") return;

    const db = getSystemData();
    const productId = document.getElementById("corpSelfProductSelect").value;
    const qty = parseInt(document.getElementById("corpSelfQuantity").value);

    const product = db.products.find(p => p.id == productId);
    if(!product) return;

    if(product.stock < qty) {
        alert("Hata: Fabrika stok miktarı yetersiz! En fazla " + product.stock + " adet isteyebilirsiniz.");
        return;
    }

    const subtotal = product.price * qty;
    const grandTotal = subtotal * 1.10; // KDV dahil toplam maliyet

    // Stok düşür
    product.stock -= qty;

    const newOrder = {
        id: new Date().getTime(),
        corpId: sessionUser.id,
        corpTitle: sessionUser.title,
        productId: product.id,
        productName: product.name,
        quantity: qty,
        total: grandTotal,
        driverId: null,
        driverName: "Atanmadı",
        status: "Hazırlanıyor"
    };

    db.orders.push(newOrder);
    saveSystemData(db);

    alert("Siparişiniz başarıyla fabrika havuzuna iletildi!");
    switchCorpTab('tab-corp-orders');
}

function renderCorpOrdersTable() {
    if(!sessionUser) return;
    const db = getSystemData();
    const tbody = document.getElementById("my-orders-table-body");
    tbody.innerHTML = "";

    const myOrders = db.orders.filter(o => o.corpId === sessionUser.id);
    
    if(myOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Henüz geçmiş siparişiniz bulunmamaktadır.</td></tr>`;
        return;
    }

    myOrders.forEach(o => {
        tbody.insertAdjacentHTML("beforeend", `
            <tr>
                <td class="fw-bold">${o.productName}</td>
                <td>${o.quantity} Adet</td>
                <td class="text-success fw-bold">${o.total.toFixed(2)} ₺</td>
                <td><small class="text-muted">Lojistik: ${o.driverName}</small></td>
                <td><span class="badge bg-info">${o.status}</span></td>
            </tr>
        `);
    });
}

// =========================================================================
// 6. SİLME VE GÜNCELLEME SÜREÇLERİ (DATA MUTATION)
// =========================================================================
function deleteProduct(id) {
    if(!confirm("Bu ürünü silmek istediğinize emin misiniz?")) return;
    let db = getSystemData();
    db.products = db.products.filter(p => p.id !== id);
    saveSystemData(db);
    renderAdminStockTable();
}

function deleteCorporate(id) {
    if(!confirm("Bayi kaydını silmek istediğinize emin misiniz?")) return;
    let db = getSystemData();
    db.corporates = db.corporates.filter(c => c.id !== id);
    saveSystemData(db);
    renderAdminCorporateTable();
}

function deleteLogistics(id) {
    if(!confirm("Lojistik personelini silmek istediğinize emin misiniz?")) return;
    let db = getSystemData();
    db.logistics = db.logistics.filter(l => l.id !== id);
    saveSystemData(db);
    renderAdminLogisticsTable();
}

function deleteAdmin(id) {
    let db = getSystemData();
    if(db.admins.length <= 1) return;
    if(!confirm("Yönetici yetkisini kaldırmak istiyor musunuz?")) return;
    db.admins = db.admins.filter(a => a.id !== id);
    saveSystemData(db);
    renderAdminSysTable();
}

function assignDriverToOrder(orderId, driverId) {
    let db = getSystemData();
    const order = db.orders.find(o => o.id === orderId);
    if(!order) return;

    if(!driverId) {
        order.driverId = null;
        order.driverName = "Atanmadı";
    } else {
        const driver = db.logistics.find(l => l.id == driverId);
        if(driver) {
            order.driverId = driver.id;
            order.driverName = driver.name;
        }
    }
    saveSystemData(db);
    renderAdminOrdersTable();
}

function updateOrderStatus(orderId, newStatus) {
    let db = getSystemData();
    const order = db.orders.find(o => o.id === orderId);
    if(order) {
        order.status = newStatus;
        saveSystemData(db);
        renderAdminOrdersTable();
    }
}

function clearPreview() {
    // Yeni ürün ekleme modali sıfırlama yardımcı tetikleyicisi
    const previewBox = document.querySelector(".preview-box");
    if(previewBox) previewBox.innerHTML = '<i class="fa-regular fa-image text-muted fs-3"></i>';
}
</script>
