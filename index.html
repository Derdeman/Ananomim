<title>Canım Eşşek Gözlüm Lale'ye Özel 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Great+Vibes&family=Mali:wght@500;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cutePink: '#ffb6c1',
                        softPink: '#fff0f5',
                        deepPink: '#ff2a8d',
                        gold: '#ffd700',
                        pastelPurple: '#e6e6fa'
                    },
                    fontFamily: {
                        cute: ['Fredoka', 'sans-serif'],
                        hand: ['Mali', 'cursive'],
                        romantic: ['Great Vibes', 'cursive'],
                        sans: ['Nunito', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd1dc 50%, #fff0f5 100%);
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* Speech Bubble Style */
        .speech-bubble {
            position: relative;
            background: #ffffff;
            border-radius: 25px;
            border: 3px solid #ff69b4;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
        }
        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 18px 15px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        .speech-bubble:before {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 20px 17px 0;
            border-style: solid;
            border-color: #ff69b4 transparent;
            display: block;
            width: 0;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 3px solid rgba(255, 182, 193, 0.85);
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.25);
        }

        /* Button Hover Effects */
        .flower-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .flower-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 42, 141, 0.35);
        }

        /* Floating & Shimmer Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.6)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.9)); transform: scale(1.03); }
        }
        .animate-glow {
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        @keyframes rotateSparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: rotateSparkle 18s linear infinite;
        }

        /* Neon Glow Text */
        .neon-title {
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 30px #ffd700, 0 0 40px #ff007f;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-between min-h-screen p-4 md:p-8">

    <!-- Floating Background Hearts Container -->
    <div id="bg-hearts" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- Music Control Button -->
    <button id="musicToggleBtn" onclick="toggleAudio()" class="fixed top-4 right-4 z-50 p-3 px-5 rounded-full bg-white/95 text-pink-600 border-2 border-pink-400 shadow-xl hover:scale-110 active:scale-95 transition-all flex items-center gap-2 font-cute text-sm">
        <i id="musicIcon" class="fas fa-music text-lg animate-bounce text-pink-500"></i>
        <span id="musicStatus" class="font-bold">Müzik Çal</span>
    </button>

    <!-- ========================================== -->
    <!-- SECTION 1: HOME PAGE WITH CUTE KITTEN -->
    <!-- ========================================== -->
    <main id="homeScreen" class="relative z-10 w-full max-w-xl my-auto flex flex-col items-center text-center transition-all duration-500">
        
        <!-- Top Badge -->
        <div class="inline-block bg-white/95 border-2 border-pink-400 px-6 py-2 rounded-full shadow-lg mb-6 animate-bounce">
            <span class="font-hand text-pink-600 font-bold text-lg md:text-xl flex items-center gap-2">
                <i class="fas fa-sparkles text-amber-400"></i> CANIM EŞŞEK GÖZLÜM <i class="fas fa-heart text-red-500"></i>
            </span>
        </div>

        <!-- Speech Bubble -->
        <div class="speech-bubble px-8 py-4 mb-6 max-w-xs sm:max-w-sm">
            <h1 class="font-cute text-2xl sm:text-3xl text-pink-600 font-bold tracking-wide">
                Çiçek sever misin? 🌸
            </h1>
        </div>

        <!-- Animated White Kitten Vector -->
        <div class="relative w-48 h-48 md:w-56 md:h-56 my-2 animate-float">
            <!-- Glowing Aura -->
            <div class="absolute inset-0 bg-pink-300/50 rounded-full blur-xl transform scale-110"></div>
            
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-2xl relative z-10">
                <!-- Big Heart behind Kitten -->
                <path d="M 100 35 C 80 5, 35 5, 35 45 C 35 75, 70 105, 100 135 C 130 105, 165 75, 165 45 C 165 5, 120 5, 100 35 Z" fill="#ff7aa2" opacity="0.9"/>
                
                <!-- Kitten Body -->
                <ellipse cx="100" cy="142" rx="42" ry="38" fill="#ffffff" stroke="#5a3d28" stroke-width="3"/>
                
                <!-- Ears -->
                <polygon points="62,85 45,50 80,72" fill="#ffffff" stroke="#5a3d28" stroke-width="3" stroke-linejoin="round"/>
                <polygon points="62,82 52,58 75,73" fill="#ffb6c1"/>
                
                <polygon points="138,85 155,50 120,72" fill="#ffffff" stroke="#5a3d28" stroke-width="3" stroke-linejoin="round"/>
                <polygon points="138,82 148,58 125,73" fill="#ffb6c1"/>

                <!-- Kitten Head -->
                <ellipse cx="100" cy="100" rx="52" ry="44" fill="#ffffff" stroke="#5a3d28" stroke-width="3.5"/>
                
                <!-- Cheeks -->
                <ellipse cx="70" cy="112" rx="10" ry="6" fill="#ff8da1" opacity="0.8"/>
                <ellipse cx="130" cy="112" rx="10" ry="6" fill="#ff8da1" opacity="0.8"/>

                <!-- Cute Big Eyes -->
                <circle cx="78" cy="100" r="7.5" fill="#4a2e1b"/>
                <circle cx="76" cy="98" r="2.5" fill="#ffffff"/>
                
                <circle cx="122" cy="100" r="7.5" fill="#4a2e1b"/>
                <circle cx="120" cy="98" r="2.5" fill="#ffffff"/>

                <!-- Cute Mouth & Nose -->
                <path d="M 93 108 Q 96.5 113, 100 108 Q 103.5 113, 107 108" fill="none" stroke="#5a3d28" stroke-width="3" stroke-linecap="round"/>
                <polygon points="98,104 102,104 100,107" fill="#ff8da1"/>

                <!-- Paws -->
                <ellipse cx="84" cy="168" rx="10" ry="7" fill="#ffffff" stroke="#5a3d28" stroke-width="2.5"/>
                <ellipse cx="116" cy="168" rx="10" ry="7" fill="#ffffff" stroke="#5a3d28" stroke-width="2.5"/>
            </svg>
        </div>

        <p class="font-hand text-pink-700 text-base md:text-lg mb-6 font-semibold">
            Birini seç bakalım eşşek gözlüm... 💕
        </p>

        <!-- 3 Interactive Flower Selection Buttons -->
        <div class="grid grid-cols-3 gap-3 md:gap-4 w-full">
            
            <!-- LALE Button -->
            <button onclick="selectFlower('lale')" class="flower-card glass-card p-4 rounded-3xl flex flex-col items-center border-2 border-pink-400 group">
                <span class="text-4xl sm:text-5xl mb-1 transform group-hover:scale-125 transition-transform duration-300">🌷</span>
                <h3 class="font-cute text-base sm:text-lg font-bold text-pink-600">LALE</h3>
            </button>

            <!-- GÜL Button -->
            <button onclick="selectFlower('gul')" class="flower-card glass-card p-4 rounded-3xl flex flex-col items-center border-2 border-red-400 group">
                <span class="text-4xl sm:text-5xl mb-1 transform group-hover:scale-125 transition-transform duration-300">🌹</span>
                <h3 class="font-cute text-base sm:text-lg font-bold text-red-500">GÜL</h3>
            </button>

            <!-- ORKİDE Button -->
            <button onclick="selectFlower('orkide')" class="flower-card glass-card p-4 rounded-3xl flex flex-col items-center border-2 border-purple-400 group">
                <span class="text-4xl sm:text-5xl mb-1 transform group-hover:scale-125 transition-transform duration-300">🌸</span>
                <h3 class="font-cute text-base sm:text-lg font-bold text-purple-600">ORKİDE</h3>
            </button>

        </div>
    </main>

    <!-- ========================================== -->
    <!-- SECTION 2: GLAMOROUS FLOWER SHOWCASE PAGE -->
    <!-- ========================================== -->
    <main id="flowerScreen" class="hidden relative z-10 w-full max-w-2xl my-auto flex flex-col items-center text-center transition-all duration-500">
        
        <div class="w-full glass-card p-6 md:p-8 rounded-3xl relative overflow-hidden border-4 border-pink-300 shadow-2xl flex flex-col items-center">
            
            <!-- Top Neon Title -->
            <h1 class="font-cute text-3xl sm:text-5xl font-black text-pink-600 tracking-wider my-2 neon-title">
                EŞŞEK GÖZLÜME
            </h1>
            
            <p class="font-hand text-pink-500 text-lg sm:text-xl font-bold mb-4">
                Sana Özel Şatafatlı Çiçeğin ✨
            </p>

            <!-- FLOWER RENDER DISPLAY BOX -->
            <div class="relative w-full h-72 sm:h-80 my-2 flex items-center justify-center">
                
                <!-- Rotating Golden Sparkle Background Ring -->
                <div class="absolute inset-0 flex items-center justify-center animate-spin-slow pointer-events-none opacity-80">
                    <svg viewBox="0 0 300 300" class="w-72 h-72 sm:w-80 sm:h-80">
                        <circle cx="150" cy="150" r="130" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="8 12" />
                        <circle cx="150" cy="150" r="110" fill="none" stroke="#ff69b4" stroke-width="1.5" stroke-dasharray="5 10" />
                    </svg>
                </div>

                <!-- FLOWER CONTAINER (Dynamic SVG Rendered Here) -->
                <div id="flowerDisplay" class="relative z-10 w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center animate-glow">
                    <!-- SVG gets injected dynamically -->
                </div>
            </div>

            <!-- Romantic Message Box -->
            <div class="bg-white/80 border-2 border-pink-300 p-5 rounded-2xl shadow-inner my-4 w-full">
                <p id="flowerMessage" class="font-cute text-lg sm:text-xl text-pink-700 leading-relaxed font-bold">
                    "CANIM Eşşek Gözlüm... Dünyanın en güzel çiçeği sensin! ❤️"
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap justify-center gap-3 mt-3 w-full">
                <button onclick="toggleAudio()" class="bg-gradient-to-r from-amber-400 to-pink-500 hover:from-amber-500 hover:to-pink-600 text-white font-cute font-bold py-3 px-5 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 flex items-center gap-2 text-sm sm:text-base">
                    <i class="fas fa-music"></i> Romantik Melodi
                </button>
                <button onclick="triggerHeartShower()" class="bg-gradient-to-r from-pink-500 to-red-500 hover:from-pink-600 hover:to-red-600 text-white font-cute font-bold py-3 px-5 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 flex items-center gap-2 text-sm sm:text-base">
                    <i class="fas fa-heart"></i> Kalp Yağmuru
                </button>
                <button onclick="goBackHome()" class="bg-gray-100 hover:bg-pink-100 text-pink-600 font-cute font-bold py-3 px-5 rounded-full border-2 border-pink-300 shadow transition-transform hover:scale-105 active:scale-95 flex items-center gap-2 text-sm sm:text-base">
                    <i class="fas fa-rotate-left"></i> Başka Çiçek Seç
                </button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-4 text-xs font-cute text-pink-700 font-bold">
        Eşşek Gözlüme Sonsuz Aşkla Hazırlandı 💕
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. FLOATING BACKGROUND HEARTS ---
        function createBgHearts() {
            const container = document.getElementById('bg-hearts');
            container.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.className = 'absolute text-pink-300/40 text-xl md:text-3xl animate-float';
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${Math.random() * 3 + 3}s`;
                heart.style.animationDelay = `${Math.random() * 2}s`;
                heart.innerHTML = '<i class="fas fa-heart"></i>';
                container.appendChild(heart);
            }
        }
        createBgHearts();

        // --- 2. HIGH QUALITY SVG FLOWERS ---
        const FLOWER_SVGS = {
            // HIGHLY SHAFATLI LALE (TULIP)
            lale: `
            <svg viewBox="0 0 200 240" class="w-full h-full drop-shadow-2xl">
                <defs>
                    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4caf50"/>
                        <stop offset="100%" stop-color="#1b5e20"/>
                    </linearGradient>
                    <linearGradient id="tulipMain" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ff1493"/>
                        <stop offset="50%" stop-color="#ff69b4"/>
                        <stop offset="100%" stop-color="#c71585"/>
                    </linearGradient>
                    <linearGradient id="tulipGold" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffd700"/>
                        <stop offset="100%" stop-color="#ff8c00"/>
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Stem & Leaves -->
                <path d="M 100 230 Q 90 170 100 120" stroke="url(#stemGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path d="M 100 190 Q 50 160 40 120 Q 70 140 100 170" fill="url(#stemGrad)"/>
                <path d="M 100 180 Q 150 150 160 110 Q 130 130 100 160" fill="url(#stemGrad)"/>

                <!-- Golden Aura Back Petals -->
                <ellipse cx="100" cy="85" rx="45" ry="55" fill="url(#tulipGold)" filter="url(#glow)"/>

                <!-- Main Tulip Petals -->
                <!-- Left Petal -->
                <path d="M 100 125 C 50 110 40 60 70 35 C 90 55 95 90 100 125 Z" fill="url(#tulipMain)"/>
                <!-- Right Petal -->
                <path d="M 100 125 C 150 110 160 60 130 35 C 110 55 105 90 100 125 Z" fill="url(#tulipMain)"/>
                <!-- Center Glowing Petal -->
                <path d="M 100 130 C 70 110 65 50 100 25 C 135 50 130 110 100 130 Z" fill="#ff2a8d" filter="url(#glow)"/>

                <!-- Crown & Sparkles -->
                <circle cx="100" cy="25" r="7" fill="#ffd700"/>
                <circle cx="75" cy="40" r="5" fill="#ffffff" opacity="0.9"/>
                <circle cx="125" cy="40" r="5" fill="#ffffff" opacity="0.9"/>
                <!-- Diamond center -->
                <polygon points="100,60 106,72 100,84 94,72" fill="#ffffff"/>
            </svg>`,

            // GLAMOROUS RED ROSE
            gul: `
            <svg viewBox="0 0 200 240" class="w-full h-full drop-shadow-2xl">
                <defs>
                    <linearGradient id="roseStem" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#388e3c"/>
                        <stop offset="100%" stop-color="#1b5e20"/>
                    </linearGradient>
                    <radialGradient id="roseRed" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ff1744"/>
                        <stop offset="70%" stop-color="#d50000"/>
                        <stop offset="100%" stop-color="#880e4f"/>
                    </radialGradient>
                </defs>

                <!-- Stem -->
                <path d="M 100 230 Q 110 170 100 110" stroke="url(#roseStem)" stroke-width="9" fill="none" stroke-linecap="round"/>
                <!-- Leaves -->
                <path d="M 102 180 Q 140 170 150 140 Q 120 150 102 175" fill="url(#roseStem)"/>
                <path d="M 98 160 Q 60 150 50 120 Q 80 130 98 155" fill="url(#roseStem)"/>

                <!-- Outer Petals -->
                <circle cx="100" cy="80" r="55" fill="#880e4f"/>
                <circle cx="85" cy="80" r="45" fill="#c2185b"/>
                <circle cx="115" cy="80" r="45" fill="#d32f2f"/>
                <circle cx="100" cy="68" r="42" fill="#e53935"/>
                <circle cx="100" cy="88" r="38" fill="url(#roseRed)"/>
                
                <!-- Inner Spiral Layer -->
                <path d="M 85 75 Q 100 50 115 75 Q 100 105 85 75 Z" fill="#ff1744"/>
                <path d="M 90 75 Q 100 62 110 75 Q 100 90 90 75 Z" fill="#ffd700"/>

                <!-- Sparkle Dots -->
                <circle cx="70" cy="60" r="3" fill="#ffffff"/>
                <circle cx="130" cy="60" r="4" fill="#ffffff"/>
                <circle cx="100" cy="40" r="3" fill="#ffd700"/>
            </svg>`,

            // ELEGANT PURPLE ORCHID
            orkide: `
            <svg viewBox="0 0 200 240" class="w-full h-full drop-shadow-2xl">
                <defs>
                    <linearGradient id="orchidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e1bee7"/>
                        <stop offset="50%" stop-color="#ba68c8"/>
                        <stop offset="100%" stop-color="#7b1fa2"/>
                    </linearGradient>
                    <radialGradient id="orchidCenter" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffd700"/>
                        <stop offset="100%" stop-color="#ff1493"/>
                    </radialGradient>
                </defs>

                <!-- Curved Stem -->
                <path d="M 100 230 Q 70 160 100 100" stroke="#4caf50" stroke-width="8" fill="none" stroke-linecap="round"/>

                <!-- 5 Large Petals -->
                <!-- Top Petal -->
                <ellipse cx="100" cy="50" rx="25" ry="42" fill="url(#orchidGrad)"/>
                <!-- Bottom Left Petal -->
                <ellipse cx="65" cy="125" rx="26" ry="42" fill="url(#orchidGrad)" transform="rotate(-30 65 125)"/>
                <!-- Bottom Right Petal -->
                <ellipse cx="135" cy="125" rx="26" ry="42" fill="url(#orchidGrad)" transform="rotate(30 135 125)"/>
                <!-- Side Left Petal -->
                <ellipse cx="55" cy="85" rx="30" ry="45" fill="url(#orchidGrad)" transform="rotate(-65 55 85)"/>
                <!-- Side Right Petal -->
                <ellipse cx="145" cy="85" rx="30" ry="45" fill="url(#orchidGrad)" transform="rotate(65 145 85)"/>

                <!-- Orchid Labellum / Center Lip -->
                <path d="M 100 80 Q 75 110 100 125 Q 125 110 100 80 Z" fill="#ff1493"/>
                <circle cx="100" cy="92" r="12" fill="url(#orchidCenter)"/>
                <circle cx="100" cy="92" r="5" fill="#ffffff"/>
            </svg>`
        };

        // --- 3. FLOWER SELECTION NAVIGATION ---
        let currentSelected = 'lale';

        function selectFlower(type) {
            currentSelected = type;

            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('flowerScreen').classList.remove('hidden');

            const displayDiv = document.getElementById('flowerDisplay');
            const messageP = document.getElementById('flowerMessage');

            // Set dynamic SVG
            displayDiv.innerHTML = FLOWER_SVGS[type] || FLOWER_SVGS['lale'];

            // Set Message based on choice
            if (type === 'lale') {
                messageP.innerHTML = `"Canım Lale'm, Eşşek Gözlüm... Dünyanın en güzel ve en özel çiçeği sensin! ❤️"`;
            } else if (type === 'gul') {
                messageP.innerHTML = `"Tüm kırmızı güller bir araya gelse bile senin o güzel eşşek gözlerinin yanında sönük kalır! 🌹"`;
            } else if (type === 'orkide') {
                messageP.innerHTML = `"Orkide kadar asil, zarif ve eşsizsin eşşek gözlüm. Seni her şeyden çok seviyorum! 🌸"`;
            }

            triggerHeartShower();
        }

        function goBackHome() {
            document.getElementById('flowerScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
        }

        // --- 4. HEART & SPARKLE CONFETTI SHOWER ---
        function triggerHeartShower() {
            if (typeof confetti === 'function') {
                const heart = confetti.shapeFromText({ text: '❤️', scalar: 2 });
                const flowerIcon = confetti.shapeFromText({ 
                    text: currentSelected === 'lale' ? '🌷' : (currentSelected === 'gul' ? '🌹' : '🌸'), 
                    scalar: 2 
                });
                const sparkle = confetti.shapeFromText({ text: '✨', scalar: 1.8 });

                confetti({
                    shapes: [heart, flowerIcon, sparkle],
                    particleCount: 40,
                    spread: 90,
                    origin: { y: 0.6 }
                });
            }
        }

        // --- 5. WEB AUDIO API ROMANTIC MELODY ---
        let audioCtx = null;
        let isAudioPlaying = false;
        let melodyInterval = null;

        function playRomanticNote() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const scale = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // C, E, G, C5, E5, G5
            const note = scale[Math.floor(Math.random() * scale.length)];

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.8);
        }

        function toggleAudio() {
            const statusText = document.getElementById('musicStatus');
            const musicIcon = document.getElementById('musicIcon');

            if (!isAudioPlaying) {
                isAudioPlaying = true;
                statusText.innerText = 'Müzik Durdur';
                musicIcon.className = 'fas fa-pause text-lg text-pink-600';
                playRomanticNote();
                melodyInterval = setInterval(playRomanticNote, 700);
            } else {
                isAudioPlaying = false;
                statusText.innerText = 'Müzik Çal';
                musicIcon.className = 'fas fa-music text-lg text-pink-500 animate-bounce';
                clearInterval(melodyInterval);
            }
        }
    </script>
</body>
</html>
